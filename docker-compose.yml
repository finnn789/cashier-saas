# One-command demo:  docker compose up -d --build        (postgres + backend, demo seed)
# With AI service:   docker compose --profile ai up -d --build
# Copy .env.example to .env first; CASHIER_JWT_SECRET_B64, CASHIER_GRPC_SERVICE_KEY and AI_INTERNAL_API_KEY are mandatory.
# gRPC (9090) is reachable only on the internal compose network (not published to the host).
name: cashier-saas

services:
  postgres:
    # 17 (not 16): V1__initial_schema.sql is a pg_dump 18 file using `SET transaction_timeout` (PG17+).
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cashier_saas
      POSTGRES_USER: cashier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cashier_demo}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashier -d cashier_saas"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      CASHIER_DB_URL: jdbc:postgresql://postgres:5432/cashier_saas
      CASHIER_DB_USERNAME: cashier
      CASHIER_DB_PASSWORD: ${POSTGRES_PASSWORD:-cashier_demo}
      CASHIER_JWT_SECRET_B64: ${CASHIER_JWT_SECRET_B64:?set CASHIER_JWT_SECRET_B64 in .env (see .env.example)}
      CASHIER_JWT_ISSUER: ${CASHIER_JWT_ISSUER:-cashier-saas}
      CASHIER_JWT_AUDIENCE: ${CASHIER_JWT_AUDIENCE:-cashier-saas-api}
      CASHIER_REFRESH_COOKIE_SECURE: "false"
      CASHIER_GRPC_PORT: "9090"
      CASHIER_GRPC_SERVICE_KEY: ${CASHIER_GRPC_SERVICE_KEY:?set CASHIER_GRPC_SERVICE_KEY in .env (see .env.example)}
      # Staff sync (in progress): blank AI_SERVICE_BASE_URL in .env falls back to the compose service below.
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://ai-services:8001}
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:?set AI_INTERNAL_API_KEY in .env (see .env.example)}
      # REST rate limiter: tunable from .env, defaults match application.properties.
      CASHIER_RATE_LIMIT_ENABLED: ${CASHIER_RATE_LIMIT_ENABLED:-true}
      CASHIER_RATE_LIMIT_MAX_BUCKETS: ${CASHIER_RATE_LIMIT_MAX_BUCKETS:-100000}
      CASHIER_RATE_LIMIT_AUTH_PER_MINUTE: ${CASHIER_RATE_LIMIT_AUTH_PER_MINUTE:-10}
      CASHIER_RATE_LIMIT_AUTH_BURST: ${CASHIER_RATE_LIMIT_AUTH_BURST:-10}
      CASHIER_RATE_LIMIT_AUTHENTICATED_PER_MINUTE: ${CASHIER_RATE_LIMIT_AUTHENTICATED_PER_MINUTE:-300}
      CASHIER_RATE_LIMIT_AUTHENTICATED_BURST: ${CASHIER_RATE_LIMIT_AUTHENTICATED_BURST:-60}
      CASHIER_RATE_LIMIT_ANONYMOUS_OTHER_PER_MINUTE: ${CASHIER_RATE_LIMIT_ANONYMOUS_OTHER_PER_MINUTE:-120}
      CASHIER_RATE_LIMIT_ANONYMOUS_OTHER_BURST: ${CASHIER_RATE_LIMIT_ANONYMOUS_OTHER_BURST:-30}
    ports:
      - "${BACKEND_HTTP_PORT:-8081}:8080"
    expose:
      - "9090"
    restart: unless-stopped

  ai-services:
    profiles: ["ai"]
    build:
      context: ./Ai-services
      dockerfile: Dockerfile
    env_file:
      - ./Ai-services/.env
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://cashier:${POSTGRES_PASSWORD:-cashier_demo}@postgres:5432/cashier_ai
      CASHIER_GRPC_HOST: backend
      CASHIER_GRPC_PORT: "9090"
      CASHIER_GRPC_USE_TLS: "false"
      CASHIER_GRPC_SERVICE_KEY: ${CASHIER_GRPC_SERVICE_KEY:?set CASHIER_GRPC_SERVICE_KEY in .env (see .env.example)}
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:?set AI_INTERNAL_API_KEY in .env (see .env.example)}
      # Development fallback only (in progress); never overrides a verified staff tenant.
      AI_TENANT_ID: ${AI_TENANT_ID:-00000000-0000-4000-8000-0000000000b1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_FILE_ENABLED: ${LOG_FILE_ENABLED:-false}
    # Uncomment together with LOG_FILE_ENABLED=true to keep rotating log files on the host
    # (the container user is `app`; the host directory must be writable by it).
    # volumes:
    #   - ./Ai-services/logs:/app/logs
    ports:
      - "${AI_HTTP_PORT:-8001}:8001"
    restart: unless-stopped

volumes:
  pgdata:
