$kind: http-request
url: "{{baseUrl}}/api/v1/cashier/outlets/{{outletId}}/fnb/inventory/items/{{inventoryItemId}}/movements"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Restock movement row has actorName of the owner", () => {
       pm.response.to.have.status(200);
       const m = pm.response.json().data.find(x => x.type === "RESTOCK");
       pm.expect(m, "restock row").to.exist;
       pm.expect(m.actorName).to.eql(pm.variables.get("fullName"));
      });
    language: text/javascript
order: 5000
