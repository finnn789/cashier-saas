$kind: http-request
url: "{{baseUrl}}/api/v1/merchant/outlets/{{outletId}}/fnb/products/{{productId}}/recipe"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "lines": [
        { "inventoryItemId": "{{inventoryItemId}}", "quantityPerUnit": 2 }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Recipe line costEstimate is null before any purchase cost", () => {
       pm.response.to.have.status(200);
       const line = pm.response.json().data.lines[0];
       pm.expect(line.inventoryItemId).to.eql(pm.collectionVariables.get("inventoryItemId"));
       pm.expect(line.costEstimate).to.be.null;
      });
    language: text/javascript
order: 2000
