$kind: http-request
url: "{{baseUrl}}/api/v1/cashier/outlets/{{outletId}}/fnb/orders?page=0&size=20&status=OPEN&paymentStatus=UNPAID"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data && r.data.orders && r.data.orders.length) pm.collectionVariables.set("orderId", r.data.orders[0].orderId);
      }
      pm.test("Unpaid order list shows cashierName and no payment fields", () => {
       pm.response.to.have.status(200);
       const o = pm.response.json().data.orders.find(x => x.orderId === pm.collectionVariables.get("orderId"));
       pm.expect(o, "checked-out order listed").to.exist;
       pm.expect(o.cashierName).to.eql(pm.variables.get("fullName"));
       pm.expect(o).to.not.have.property("methodLabel");
       pm.expect(o).to.not.have.property("receiptNumber");
      });
    language: text/javascript
description: |-
  Tagihan tertahan (OPEN/UNPAID). Filter lain: source, serta from dan to serta orderNumber (lihat Search Orders By Date And Number).
order: 3000
