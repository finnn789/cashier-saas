$kind: http-request
url: "{{baseUrl}}/api/v1/cashier/outlets/{{outletId}}/fnb/orders?page=0&size=20&status=OPEN&paymentStatus=UNPAID"
method: GET
headers:
  Accept: application/json
scripts:
  - type: http:afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data && r.data.orders && r.data.orders.length) pm.collectionVariables.set("orderId", r.data.orders[0].orderId);
      }
    language: text/javascript
description: |-
  Tagihan tertahan (OPEN/UNPAID). Filter lain: source, serta from dan to serta orderNumber (lihat Search Orders By Date And Number).
order: 3000
