$kind: http-request
url: "{{baseUrl}}/api/v1/cashier/outlets/{{outletId}}/fnb/orders"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Idempotency-Key
    value: "{{posOrderKey}}"
    description: Gunakan key yang sama saat retry payload yang sama. Ganti untuk pesanan baru.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "serviceType": "DINE_IN",
      "customerLabel": "Pelanggan KedaiMbo",
      "items": [
        {
          "productId": "{{productId}}",
          "quantity": 1,
          "note": "",
          "optionIds": []
        }
      ]
    }
scripts:
  - type: http:afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data && r.data.id) pm.collectionVariables.set("orderId", r.data.id);
      }
    language: text/javascript
order: 1000
