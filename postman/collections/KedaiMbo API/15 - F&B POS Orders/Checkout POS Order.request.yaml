$kind: http-request
url: "{{baseUrl}}/api/v1/cashier/outlets/{{outletId}}/fnb/orders"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Idempotency-Key
    value: "{{posOrderKey}}"
    description: Gunakan key yang sama saat retry payload yang sama. Ganti untuk pesanan baru.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "serviceType": "DINE_IN",
      "customerLabel": "Pelanggan KedaiMbo",
      "orderNote": "Es dipisah, tanpa sedotan",
      "items": [
        {
          "productId": "{{productId}}",
          "quantity": 1,
          "note": "",
          "optionIds": []
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data && (r.data.orderId || r.data.id)) pm.collectionVariables.set("orderId", r.data.orderId || r.data.id);
      }
      pm.test("Checkout shows cashierName and no payment fields while unpaid", () => {
       pm.response.to.have.status(201);
       const d = pm.response.json().data;
       pm.expect(d.cashierName).to.eql(pm.variables.get("fullName"));
       pm.expect(d).to.not.have.property("methodLabel");
       pm.expect(d).to.not.have.property("receiptNumber");
      });
    language: text/javascript
order: 1000
