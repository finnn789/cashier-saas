$kind: http-request
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "{{fullName}}",
      "email": "{{email}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
order: 1000
