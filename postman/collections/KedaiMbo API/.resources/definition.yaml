scripts:
  - type: http:beforeRequest
    code: |-
      ["onboardingKey","saleKey","publicOrderKey","posOrderKey"].forEach(function (key) {
       if (!pm.variables.get(key)) pm.collectionVariables.set(key, pm.variables.replaceIn("{{$guid}}"));
      });
    language: text/javascript
  - type: http:afterResponse
    code: |-
      switch (pm.info.requestName) {
      case "Register Account": {
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data && r.data.accessToken) {
        const d = r.data;
        pm.collectionVariables.set("accessToken", d.accessToken);
        let isAccount = !d.tenantId;
        try {
         const part = d.accessToken.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
         const claims = JSON.parse(atob(part));
         isAccount = claims.scope === "ACCOUNT";
        } catch (e) {}
        if (isAccount) pm.collectionVariables.set("accountToken", d.accessToken);
        if (d.tenantId) pm.collectionVariables.set("tenantId", d.tenantId);
        if (d.outletId) pm.collectionVariables.set("outletId", d.outletId);
       }
      }
      break;
      }
      case "Login": {
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data && r.data.accessToken) {
        const d = r.data;
        pm.collectionVariables.set("accessToken", d.accessToken);
        let isAccount = !d.tenantId;
        try {
         const part = d.accessToken.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
         const claims = JSON.parse(atob(part));
         isAccount = claims.scope === "ACCOUNT";
        } catch (e) {}
        if (isAccount) pm.collectionVariables.set("accountToken", d.accessToken);
        if (d.tenantId) pm.collectionVariables.set("tenantId", d.tenantId);
        if (d.outletId) pm.collectionVariables.set("outletId", d.outletId);
       }
      }
      break;
      }
      case "Select Merchant": {
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data && r.data.accessToken) {
        const d = r.data;
        pm.collectionVariables.set("accessToken", d.accessToken);
        let isAccount = !d.tenantId;
        try {
         const part = d.accessToken.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
         const claims = JSON.parse(atob(part));
         isAccount = claims.scope === "ACCOUNT";
        } catch (e) {}
        if (isAccount) pm.collectionVariables.set("accountToken", d.accessToken);
        if (d.tenantId) pm.collectionVariables.set("tenantId", d.tenantId);
        if (d.outletId) pm.collectionVariables.set("outletId", d.outletId);
       }
      }
      break;
      }
      case "Get CSRF Token": {
      if (pm.response.code === 200) { const r = pm.response.json(); if (r.success) pm.collectionVariables.set("csrfToken",r.data); }
      break;
      }
      case "Refresh Session": {
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data && r.data.accessToken) {
        const d = r.data;
        pm.collectionVariables.set("accessToken", d.accessToken);
        let isAccount = !d.tenantId;
        try {
         const part = d.accessToken.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
         const claims = JSON.parse(atob(part));
         isAccount = claims.scope === "ACCOUNT";
        } catch (e) {}
        if (isAccount) pm.collectionVariables.set("accountToken", d.accessToken);
        if (d.tenantId) pm.collectionVariables.set("tenantId", d.tenantId);
        if (d.outletId) pm.collectionVariables.set("outletId", d.outletId);
       }
      }
      break;
      }
      case "Logout": {
      if (pm.response.code === 200 && pm.response.json().success) { pm.collectionVariables.set("accessToken",""); pm.collectionVariables.set("accountToken",""); }
      break;
      }
      case "Get Onboarding Status": {
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data) {
        if (r.data.pendingTenantId !== undefined && r.data.pendingTenantId !== null) pm.collectionVariables.set("tenantId", r.data.pendingTenantId);
       }
      }
      break;
      }
      case "Start Free Tier": {
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data) {
        if (r.data.tenantId !== undefined && r.data.tenantId !== null) pm.collectionVariables.set("tenantId", r.data.tenantId);
       }
      }
      break;
      }
      case "Complete Business Profile": {
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data && r.data.accessToken) {
        const d = r.data;
        pm.collectionVariables.set("accessToken", d.accessToken);
        let isAccount = !d.tenantId;
        try {
         const part = d.accessToken.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
         const claims = JSON.parse(atob(part));
         isAccount = claims.scope === "ACCOUNT";
        } catch (e) {}
        if (isAccount) pm.collectionVariables.set("accountToken", d.accessToken);
        if (d.tenantId) pm.collectionVariables.set("tenantId", d.tenantId);
        if (d.outletId) pm.collectionVariables.set("outletId", d.outletId);
       }
      }
      break;
      }
      case "Issue Cashier Invitation": {
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data) {
        if (r.data.code !== undefined && r.data.code !== null) pm.collectionVariables.set("invitationCode", r.data.code);
       }
      }
      break;
      }
      case "Create Category": {
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data) {
        if (r.data.id !== undefined && r.data.id !== null) pm.collectionVariables.set("categoryId", r.data.id);
       }
      }
      break;
      }
      case "Create Product": {
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data) {
        if (r.data.id !== undefined && r.data.id !== null) pm.collectionVariables.set("productId", r.data.id);
       }
      }
      break;
      }
      case "Create Option Group": {
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data) {
        if (r.data.id !== undefined && r.data.id !== null) pm.collectionVariables.set("groupId", r.data.id);
       }
      }
      break;
      }
      case "Create Option": {
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data) {
        if (r.data.id !== undefined && r.data.id !== null) pm.collectionVariables.set("optionId", r.data.id);
       }
      }
      break;
      }
      case "Create Table & QR": {
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data) {
        if (r.data.id !== undefined && r.data.id !== null) pm.collectionVariables.set("tableId", r.data.id);
        if (r.data.qrToken !== undefined && r.data.qrToken !== null) pm.collectionVariables.set("qrToken", r.data.qrToken);
       }
      }
      break;
      }
      case "Rotate Table QR": {
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data) {
        if (r.data.qrToken !== undefined && r.data.qrToken !== null) pm.collectionVariables.set("qrToken", r.data.qrToken);
       }
      }
      break;
      }
      case "Get Outlet QR": {
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data) {
        if (r.data.token !== undefined && r.data.token !== null) pm.collectionVariables.set("outletQrToken", r.data.token);
       }
      }
      break;
      }
      case "Create Outlet QR": {
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data) {
        if (r.data.token !== undefined && r.data.token !== null) pm.collectionVariables.set("outletQrToken", r.data.token);
       }
      }
      break;
      }
      case "Rotate Outlet QR": {
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data) {
        if (r.data.token !== undefined && r.data.token !== null) pm.collectionVariables.set("outletQrToken", r.data.token);
       }
      }
      break;
      }
      case "Checkout POS Order": {
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data) {
        if (r.data.orderId !== undefined && r.data.orderId !== null) pm.collectionVariables.set("orderId", r.data.orderId);
       }
      }
      break;
      }
      case "Checkout Public Order": {
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data) {
        if (r.data.orderToken !== undefined && r.data.orderToken !== null) pm.collectionVariables.set("orderToken", r.data.orderToken);
       }
      }
      break;
      }
      case "Create Catalog Item": {
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data) {
        if (r.data.id !== undefined && r.data.id !== null) pm.collectionVariables.set("itemId", r.data.id);
       }
      }
      break;
      }
      case "Checkout Cashier Sale": {
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data) {
        if (r.data.id !== undefined && r.data.id !== null) pm.collectionVariables.set("saleId", r.data.id);
       }
      }
      break;
      }
      }
    language: text/javascript
auth:
