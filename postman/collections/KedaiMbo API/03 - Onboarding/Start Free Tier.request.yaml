$kind: http-request
url: "{{baseUrl}}/api/v1/onboarding/freetier"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Idempotency-Key
    value: "{{onboardingKey}}"
    description: Gunakan key yang sama saat retry payload yang sama. Ganti untuk transaksi baru.
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: Bearer {{accountToken}}
body:
  type: json
  content: |-
    {
      "businessTypeCode": "FNB"
    }
auth:
  type: noauth
order: 3000
