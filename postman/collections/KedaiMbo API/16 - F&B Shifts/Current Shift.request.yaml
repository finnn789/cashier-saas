$kind: http-request
url: "{{baseUrl}}/api/v1/cashier/outlets/{{outletId}}/fnb/shifts/current"
method: GET
headers:
  Accept: application/json
scripts:
  - type: http:afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data && r.data.id) pm.collectionVariables.set("shiftId", r.data.id);
      }
    language: text/javascript
order: 2000
