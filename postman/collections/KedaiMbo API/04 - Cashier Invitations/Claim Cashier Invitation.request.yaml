$kind: http-request
url: "{{baseUrl}}/api/v1/onboarding/cashier-invitations/claim"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{accountToken}}
body:
  type: json
  content: |-
    {
      "code": "{{invitationCode}}"
    }
auth:
  type: noauth
order: 2000
