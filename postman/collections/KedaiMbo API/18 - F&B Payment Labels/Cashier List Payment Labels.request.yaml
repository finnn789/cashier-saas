$kind: http-request
url: "{{baseUrl}}/api/v1/cashier/outlets/{{outletId}}/fnb/payment-labels"
method: GET
headers:
  Accept: application/json
scripts:
  - type: http:afterResponse
    code: |-
      if (pm.response.code >= 200 && pm.response.code < 300) {
       const r = pm.response.json();
       if (r.success && r.data && r.data.length) pm.collectionVariables.set("labelId", r.data[0].id);
      }
    language: text/javascript
description: |-
  OWNER dan CASHIER. Hanya label aktif; dipakai sebagai pilihan label pada pembayaran non-tunai.
order: 4000
