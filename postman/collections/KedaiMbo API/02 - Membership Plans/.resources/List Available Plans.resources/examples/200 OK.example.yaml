$kind: http-example
name: 200 OK - tiga paket
request:
  method: GET
  url: "{{baseUrl}}/api/v1/public/plans"
  headers:
    - key: Accept
      value: "application/json"
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "code": 200,
        "message": "Katalog paket berhasil diambil.",
        "data": [
          { "code": "FREETIER", "name": "Freetier", "available": true, "monthlyPrice": 0, "yearlyPrice": 0 },
          { "code": "PRO", "name": "Pro", "available": true, "monthlyPrice": 59000, "yearlyPrice": 590000 },
          { "code": "PREMIUM", "name": "Premium", "available": true, "monthlyPrice": 119000, "yearlyPrice": 1190000 }
        ],
        "timestamp": "2026-11-14T10:00:00"
      }
order: 1000
