$kind: http-request
url: "{{baseUrl}}/api/v1/merchant/outlets/{{outletId}}/fnb/products/{{productId}}/recipe"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: '{"lines": [{"inventoryItemId": "{{inventoryItemId}}", "quantityPerUnit": 18.000}]}'
scripts:
  - type: afterResponse
    code: pm.test('Status code is 200 OK', () => pm.response.to.have.status(200)); var res = pm.response.json(); pm.expect(res.success).to.be.true; pm.expect(res.data.lines).to.have.lengthOf(1);
    language: text/javascript
order: 1000
