$kind: http-request
url: "{{baseUrl}}/api/v1/merchant/outlets/{{outletId}}/fnb/products/{{productId}}/recipe"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: pm.test('Status code is 200 OK', () => pm.response.to.have.status(200)); var res = pm.response.json(); pm.expect(res.success).to.be.true; pm.expect(res.data.lines).to.be.an('array'); res.data.lines.forEach(function (l) { pm.expect(l).to.have.property('inventoryItemName'); pm.expect(l).to.have.property('unit'); pm.expect(l).to.have.property('quantityPerUnit'); });
    language: text/javascript
order: 2000
