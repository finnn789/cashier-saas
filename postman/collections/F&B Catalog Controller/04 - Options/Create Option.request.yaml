$kind: http-request
url: "{{baseUrl}}/api/v1/merchant/outlets/{{outletId}}/fnb/products/{{productId}}/groups/{{groupId}}/options"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: '{"name": "Level 1 (Pedas Sedang)", "priceAdjustment": 0.0, "available": true, "displayOrder": 1, "priceChangeReason": null}'
scripts:
  - type: afterResponse
    code: pm.test('Status code is 201 Created', () => pm.response.to.have.status(201)); var res = pm.response.json(); if (res.data && res.data.id) pm.collectionVariables.set('optionId', res.data.id);
    language: text/javascript
order: 1000
