$kind: http-request
url: "{{baseUrl}}/api/v1/merchant/outlets/{{outletId}}/fnb/products/{{productId}}/groups/{{groupId}}"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: '{"name": "Pilihan Level Pedas", "required": true, "minimumSelections": 1, "maximumSelections": 1, "displayOrder": 1}'
scripts:
  - type: afterResponse
    code: pm.test('Status code is 200 OK', () => pm.response.to.have.status(200)); var res = pm.response.json(); pm.expect(res.success).to.be.true;
    language: text/javascript
order: 3000
