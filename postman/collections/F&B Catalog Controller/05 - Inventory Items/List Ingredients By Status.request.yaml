$kind: http-request
url: "{{baseUrl}}/api/v1/cashier/outlets/{{outletId}}/fnb/inventory/items?status=LOW"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: pm.test('Status code is 200 OK', () => pm.response.to.have.status(200)); var res = pm.response.json(); pm.expect(res.success).to.be.true; pm.expect(res.data).to.be.an('array'); res.data.forEach(function (i) { pm.expect(i.stockStatus).to.eql('LOW'); });
    language: text/javascript
order: 5000
