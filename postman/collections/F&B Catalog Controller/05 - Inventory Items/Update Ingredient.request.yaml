$kind: http-request
url: "{{baseUrl}}/api/v1/merchant/outlets/{{outletId}}/fnb/inventory/items/{{inventoryItemId}}"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: '{"name": "Susu Segar", "sku": "BAHAN-SUSU-01", "unit": "ml", "reorderLevel": 500.000}'
scripts:
  - type: afterResponse
    code: pm.test('Status code is 200 OK', () => pm.response.to.have.status(200)); var res = pm.response.json(); pm.expect(res.success).to.be.true;
    language: text/javascript
order: 2000
