$kind: http-request
url: "{{baseUrl}}/api/v1/cashier/outlets/{{outletId}}/fnb/inventory/items/{{inventoryItemId}}/movements"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: '{"type": "WASTE", "quantity": 120.000, "reason": "Tumpah saat produksi", "idempotencyKey": "{{$guid}}"}'
scripts:
  - type: afterResponse
    code: pm.test('Status code is 201 Created', () => pm.response.to.have.status(201)); var res = pm.response.json(); pm.expect(res.success).to.be.true; pm.expect(res.data.type).to.eql('WASTE'); pm.expect(Number(res.data.quantityDelta)).to.be.below(0);
    language: text/javascript
order: 2000
