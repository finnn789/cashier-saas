# Test profile: the datasource is supplied by Testcontainers (see AbstractPostgresIntegrationTest).
# Flyway migrates the real db/migration scripts; Hibernate ddl-auto=validate (from main config) checks them.
app.security.jwt.issuer=cashier-saas-test
app.security.jwt.audience=cashier-saas-test-api
# Test-only Base64 of a 32-byte secret. Never use outside tests.
app.security.jwt.secret=dGVzdC1vbmx5LXNlY3JldC0zMi1ieXRlcy1sb25nISE=
app.security.jwt.access-token-ttl=PT15M
app.security.refresh-cookie-secure=false
# Avoid port clashes with a locally running instance.
grpc.server.port=0
spring.jpa.open-in-view=false
# Concurrency integration tests fire parallel bursts and must never be throttled.
app.rate-limit.enabled=false
