spring.application.name=cashier-saas

# Load developer-only environment settings from the working directory when present.
# Production continues to supply these values through the process environment.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${CASHIER_DB_URL:jdbc:postgresql://localhost:5432/cashier_saas_migrated}
spring.datasource.username=${CASHIER_DB_USERNAME:postgres}
spring.datasource.password=${CASHIER_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${CASHIER_DB_POOL_MAX_SIZE:10}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
#logging.level.org.hibernate.SQL=DEBUG


# Existing databases require an explicitly reviewed manual Flyway baseline decision; never baseline automatically.
# See docs/database/liquibase-schema-diff.md for the manual entity-versus-database diff profile.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.baseline-on-migrate=false
spring.liquibase.enabled=false

# Production must provide a Base64-encoded, cryptographically random 32-byte secret.
app.security.jwt.issuer=${CASHIER_JWT_ISSUER:cashier-saas}
app.security.jwt.audience=${CASHIER_JWT_AUDIENCE:cashier-saas-api}
app.security.jwt.secret=${CASHIER_JWT_SECRET_B64}
app.security.jwt.access-token-ttl=PT15M
app.security.jwt.refresh-token-ttl=P7D
app.security.refresh-cookie-secure=${CASHIER_REFRESH_COOKIE_SECURE:true}

# gRPC Server
grpc.server.port=${CASHIER_GRPC_PORT:9090}
grpc.server.reflection-service-enabled=false

# gRPC server security: callers authenticate with a shared key in the x-internal-service-key header.
# The key has no default (startup fails when missing or shorter than 16 characters).
# Tenant access is a database check (tenant exists, is active and has F&B enabled), not configuration.
app.grpc.service-key=${CASHIER_GRPC_SERVICE_KEY}
app.grpc.max-catalog-limit=50
app.grpc.default-catalog-limit=10
app.grpc.requests-per-second=50

# REST API rate limiter (in-memory token buckets, single instance). per-minute = refill rate, burst = bucket size.
# Override via env, e.g. CASHIER_RATE_LIMIT_AUTH_PER_MINUTE=20 or CASHIER_RATE_LIMIT_ENABLED=false.
app.rate-limit.enabled=${CASHIER_RATE_LIMIT_ENABLED:true}
app.rate-limit.max-buckets=${CASHIER_RATE_LIMIT_MAX_BUCKETS:100000}
app.rate-limit.auth.per-minute=${CASHIER_RATE_LIMIT_AUTH_PER_MINUTE:10}
app.rate-limit.auth.burst=${CASHIER_RATE_LIMIT_AUTH_BURST:10}
app.rate-limit.public-read.per-minute=${CASHIER_RATE_LIMIT_PUBLIC_READ_PER_MINUTE:240}
app.rate-limit.public-read.burst=${CASHIER_RATE_LIMIT_PUBLIC_READ_BURST:60}
app.rate-limit.public-order-write.per-minute=${CASHIER_RATE_LIMIT_PUBLIC_ORDER_WRITE_PER_MINUTE:20}
app.rate-limit.public-order-write.burst=${CASHIER_RATE_LIMIT_PUBLIC_ORDER_WRITE_BURST:10}
app.rate-limit.qr-token.per-minute=${CASHIER_RATE_LIMIT_QR_TOKEN_PER_MINUTE:600}
app.rate-limit.qr-token.burst=${CASHIER_RATE_LIMIT_QR_TOKEN_BURST:120}
app.rate-limit.realtime-ticket.per-minute=${CASHIER_RATE_LIMIT_REALTIME_TICKET_PER_MINUTE:10}
app.rate-limit.realtime-ticket.burst=${CASHIER_RATE_LIMIT_REALTIME_TICKET_BURST:5}
app.rate-limit.authenticated.per-minute=${CASHIER_RATE_LIMIT_AUTHENTICATED_PER_MINUTE:300}
app.rate-limit.authenticated.burst=${CASHIER_RATE_LIMIT_AUTHENTICATED_BURST:60}
app.rate-limit.anonymous-other.per-minute=${CASHIER_RATE_LIMIT_ANONYMOUS_OTHER_PER_MINUTE:120}
app.rate-limit.anonymous-other.burst=${CASHIER_RATE_LIMIT_ANONYMOUS_OTHER_BURST:30}
# The client IP is request.getRemoteAddr(). Enable the next line ONLY behind a trusted reverse proxy, so Tomcat
# resolves the real client IP; X-Forwarded-For is never read by the application itself.
# server.forward-headers-strategy=native

# Staff member sync to Ai-services (contract: docs/contracts/member-sync.md). Blank base URL disables the sync.
# The API key has no default and is never logged; use AI_INTERNAL_API_KEY (at least 16 characters).
app.ai-service.base-url=${AI_SERVICE_BASE_URL:}
app.ai-service.api-key=${AI_INTERNAL_API_KEY:}
app.ai-service.connect-timeout=2s
app.ai-service.read-timeout=5s
app.ai-service.max-attempts=3

