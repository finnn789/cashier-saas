[project]
name = "ai-customer-service"
version = "0.1.0"
description = "FastAPI AI Service served by Uvicorn"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0,<4",
    "aiogram==3.31.0",
    "fastapi>=0.143.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
    "SQLAlchemy>=2.0.36,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "grpcio>=1.62.0,<2",
    "grpcio-tools>=1.62.0,<2",
    "protobuf>=4.25.0,<6",
    "langgraph>=0.2.0,<0.3.0",
    "langchain-core>=0.3.0,<0.4.0",
    "langchain-openai>=0.2.0,<0.3.0",
]

[tool.uv]
package = false
