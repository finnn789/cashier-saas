name: CI

# Runs on every pull request and on every push to main.
# It only builds and tests; nothing is deployed anywhere.
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 17, mvnw verify)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # mvnw is committed without the executable bit (mode 100644); Linux runners need it.
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Unit tests (Surefire) + integration tests (Failsafe, Testcontainers postgres:17-alpine).
      # ubuntu-latest ships Docker, so Testcontainers works without extra setup.
      # No secrets are needed: test JWT/gRPC values live in src/test/resources/application-test.properties
      # and AbstractPostgresIntegrationTest.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 7

  ai-services:
    name: AI services (Python 3.12, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NON-BLOCKING for now: 8 unit tests already fail on a clean HEAD (tracked as TASK-058).
    # A failure is still visible in the logs and as an annotation, but does not turn the run red.
    # Remove this line once TASK-058 is fixed so the job becomes a real gate.
    continue-on-error: true
    defaults:
      run:
        working-directory: Ai-services
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: Ai-services/uv.lock

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Unit tests
        run: uv run --locked python -m unittest discover -s tests/unit -p "test_*.py" -v
