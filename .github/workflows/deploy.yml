name: CI/CD Cashier SaaS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cegah dua deploy berjalan bersamaan
concurrency:
  group: deploy-cashier-saas
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/finnn789/cashier-saas   # harus sama dengan image di docker-compose.yml (huruf kecil)

jobs:
  # ============ CI: build + tes ============
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'        # samakan dengan Dockerfile dan java.version di pom.xml
          cache: maven

      - name: Build dan jalankan tes
        run: ./mvnw -B clean package
        # Kalau tesmu butuh database dan belum disiapkan di CI,
        # sementara pakai: ./mvnw -B clean package -DskipTests

  # ============ Build image Docker + push ke GHCR ============
  image:
    name: Build & Push Image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (push hanya saat merge ke main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============ CD: deploy ke VPS ============
  deploy:
    name: Deploy ke VPS
    needs: image
    # Deploy hanya saat push ke main, bukan saat pull request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Tarik image baru dan restart container
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ env.IMAGE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: GHCR_PAT,GHCR_USER,IMAGE
          script: |
            set -e
            cd /home/deployment/cashier-saas
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull app
            docker compose up -d app
            docker image prune -f

            # Tunggu sampai container sehat (maks ~3 menit)
            cid=$(docker compose ps -q app)
            for i in $(seq 1 36); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo none)
              if [ "$status" = "healthy" ]; then
                echo "Deploy berhasil: app sehat"
                exit 0
              fi
              sleep 5
            done
            echo "App tidak sehat, log terakhir:"
            docker compose logs --tail 40 app
            exit 1