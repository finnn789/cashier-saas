# ==========================================
# TARGET DATABASE - user-managed local configuration
# ==========================================

url=jdbc:postgresql://localhost:5432/cashier_saas
username=postgres
password=shadowclasher
driver=org.postgresql.Driver

defaultSchemaName=public


# ==========================================
# REFERENCE - Hibernate / JPA Entities
# ==========================================

referenceUrl=hibernate:spring:org.lite.project.cashiersaas.entity?dialect=org.hibernate.dialect.PostgreSQLDialect&hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy&hibernate.implicit_naming_strategy=org.springframework.boot.hibernate.SpringImplicitNamingStrategy
referenceDriver=liquibase.ext.hibernate.database.connection.HibernateDriver

referenceDefaultSchemaName=public


# ==========================================
# DIFF CONFIGURATION
# ==========================================

diffTypes=tables,columns,indexes,foreignkeys,primarykeys,uniqueconstraints,sequences

diffExcludeObjects=table:flyway_schema_history,table:databasechangelog,table:databasechangeloglock
